[project]
name = "digitaly-ai-copilot"
version = "0.1.0"
description = "FastAPI streaming transcription and real-time copilot feedback for Digitaly teleconsultations"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "httpx>=0.27,<1",
    "websockets>=12,<16",
]

[project.optional-dependencies]
local = [
    "faster-whisper>=1.0",
]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
