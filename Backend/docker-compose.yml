services:
  db:
    image: postgres:16-alpine
    container_name: digitaly-tmp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digitaly_tmp
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - digitaly_tmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digitaly_tmp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: digitaly-tmp-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: digitaly-tmp-adminer
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: Backend/Dockerfile
    image: telemed-api:local
    container_name: digitaly-tmp-api
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/digitaly_tmp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      AI_SERVICE_URL: http://ai:8000
      WEB_ORIGIN: http://localhost:3000
      UPLOAD_DIR: /app/uploads
    ports:
      - "3001:3001"
    volumes:
      - digitaly_tmp_uploads:/app/uploads
    restart: unless-stopped

volumes:
  digitaly_tmp_pgdata:
  digitaly_tmp_uploads:
