services:
  db:
    image: postgres:16-alpine
    container_name: digitaly-tmp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digitaly_tmp
    ports:
      - "5433:5432"
    volumes:
      - digitaly_tmp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d digitaly_tmp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: digitaly-tmp-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  adminer:
    image: adminer:4
    container_name: digitaly-tmp-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    environment:
      ADMINER_DEFAULT_SERVER: db
    restart: unless-stopped

volumes:
  digitaly_tmp_pgdata:
