openapi: 3.1.0
info:
  title: Digitaly Telemedicine API
  version: 0.1.0
  description: >
    Shared HTTP contract for the Digitaly telemedicine platform. The API is served
    under the global prefix /api, therefore every path below includes it.
servers:
  - url: /
tags:
  - name: auth
    description: Registration, login, token refresh and current user
  - name: users
    description: Doctor and patient profiles
  - name: appointments
    description: Booking, email validation codes, calendars and pre-consult
  - name: consultations
    description: Consultation lifecycle and WebRTC session setup
  - name: records
    description: Medical records and patient overview
  - name: attachments
    description: Appointment and consultation attachments
  - name: health
    description: Liveness and readiness probes
paths:
  /api/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a doctor or patient
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDto'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          description: Email already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Exchange credentials for JWT tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequestDto'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokensDto'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Revoke the current refresh token
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequestDto'
      responses:
        '204':
          description: Logged out
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Get the authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users/me:
    get:
      tags: [users]
      operationId: getUserProfile
      summary: Get the authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [users]
      operationId: updateUserProfile
      summary: Update the authenticated user profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequestDto'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/users/doctors:
    get:
      tags: [users]
      operationId: listDoctors
      summary: List doctors available for booking
      security:
        - bearerAuth: []
      parameters:
        - name: specialty
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Doctors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorSummaryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/patients/{patientId}/overview:
    get:
      tags: [records]
      operationId: getPatientOverview
      summary: Get patient profile, upcoming appointment, history and pre-consult
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Patient overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PatientOverviewDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/appointments/doctors/{doctorId}/slots:
    get:
      tags: [appointments]
      operationId: listDoctorSlots
      summary: List bookable slots for a doctor
      security:
        - bearerAuth: []
      parameters:
        - name: doctorId
          in: path
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SlotDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/appointments:
    post:
      tags: [appointments]
      operationId: createAppointment
      summary: Create a pending appointment and optional pre-consult answers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequestDto'
      responses:
        '201':
          description: Appointment created with pending_code status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDto'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Slot already taken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/appointments/calendar:
    get:
      tags: [appointments]
      operationId: getPatientCalendar
      summary: List calendar entries for the authenticated patient
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Calendar entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CalendarEntryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/appointments/doctor:
    get:
      tags: [appointments]
      operationId: getDoctorAppointments
      summary: List appointments for the authenticated doctor
      security:
        - bearerAuth: []
      parameters:
        - name: date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/AppointmentStatus'
      responses:
        '200':
          description: Doctor appointments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorAppointmentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/appointments/{id}:
    get:
      tags: [appointments]
      operationId: getAppointment
      summary: Get one appointment
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Appointment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/appointments/{id}/request-code:
    post:
      tags: [appointments]
      operationId: requestAppointmentCode
      summary: Issue an email validation code for a pending appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Code issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCodeResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/appointments/{id}/resend-code:
    post:
      tags: [appointments]
      operationId: resendAppointmentCode
      summary: Invalidate and reissue the validation code
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Code reissued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCodeResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/appointments/{id}/verify-code:
    post:
      tags: [appointments]
      operationId: verifyAppointmentCode
      summary: Confirm the appointment with the emailed code
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCodeRequestDto'
      responses:
        '200':
          description: Appointment confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDto'
        '400':
          description: Invalid or expired code
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Too many attempts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/appointments/{id}/cancel:
    post:
      tags: [appointments]
      operationId: cancelAppointment
      summary: Cancel an appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelAppointmentRequestDto'
      responses:
        '200':
          description: Appointment cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppointmentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Appointment is terminal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/appointments/{id}/pre-consult:
    get:
      tags: [appointments]
      operationId: getPreConsult
      summary: Get pre-consult answers for an appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Pre-consult answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreConsultAnswerDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [appointments]
      operationId: putPreConsult
      summary: Create or replace pre-consult answers for an appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/PreConsultAnswerInputDto'
      responses:
        '200':
          description: Saved pre-consult answers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PreConsultAnswerDto'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/appointments/{id}/consultations/start:
    post:
      tags: [consultations]
      operationId: startConsultation
      summary: Start a consultation and get WebRTC ICE servers
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '201':
          description: Consultation started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartConsultationResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Appointment not confirmed or consultation already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/consultations/mine:
    get:
      tags: [consultations]
      operationId: getMyConsultations
      summary: List the authenticated patient consultation history
      security:
        - bearerAuth: []
      parameters:
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Consultation history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsultationHistoryItemDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/consultations/{id}:
    get:
      tags: [consultations]
      operationId: getConsultation
      summary: Get one consultation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Consultation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsultationDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/consultations/{id}/end:
    post:
      tags: [consultations]
      operationId: endConsultation
      summary: End an active consultation
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ConsultationId'
      responses:
        '200':
          description: Consultation ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndConsultationResponseDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Consultation is not active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/records:
    get:
      tags: [records]
      operationId: listMedicalRecords
      summary: List medical record summaries
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Medical record summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MedicalRecordSummaryDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [records]
      operationId: createMedicalRecord
      summary: Create a medical record for a consultation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMedicalRecordRequestDto'
      responses:
        '201':
          description: Medical record created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordDto'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Record already exists for this consultation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/records/{recordId}:
    get:
      tags: [records]
      operationId: getMedicalRecord
      summary: Get one medical record
      security:
        - bearerAuth: []
      parameters:
        - name: recordId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Medical record
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalRecordDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/appointments/{id}/attachments:
    get:
      tags: [attachments]
      operationId: listAttachments
      summary: List attachments for an appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      responses:
        '200':
          description: Attachments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [attachments]
      operationId: uploadAttachment
      summary: Upload an attachment for an appointment
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AppointmentId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                kind:
                  $ref: '#/components/schemas/AttachmentKind'
                consultationId:
                  type: string
      responses:
        '201':
          description: Attachment uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDto'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
        '415':
          description: Unsupported media type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseDto'
  /api/attachments/{id}:
    get:
      tags: [attachments]
      operationId: getAttachment
      summary: Get attachment metadata
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Attachment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDto'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/health:
    get:
      tags: [health]
      operationId: getHealth
      summary: Liveness probe
      security: []
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponseDto'
  /api/ready:
    get:
      tags: [health]
      operationId: getReady
      summary: Readiness probe with dependency checks
      security: []
      responses:
        '200':
          description: Readiness status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponseDto'
        '503':
          description: Service degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponseDto'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AppointmentId:
      name: id
      in: path
      required: true
      schema:
        type: string
    ConsultationId:
      name: id
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Request could not be processed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
    Unauthorized:
      description: Authentication required or token invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
    Forbidden:
      description: Authenticated but not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseDto'
  schemas:
    UserRole:
      type: string
      enum: [doctor, patient]
    AppointmentStatus:
      type: string
      enum: [pending_code, confirmed, in_progress, completed, cancelled]
    ConsultationStatus:
      type: string
      enum: [active, ended]
    FeedbackSeverity:
      type: string
      enum: [info, warning, critical]
    AttachmentKind:
      type: string
      enum: [document, image, other]
    HealthStatus:
      type: string
      enum: [ok, degraded]
    DependencyStatus:
      type: string
      enum: [up, down, unknown]
    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - UNAUTHENTICATED
        - FORBIDDEN
        - NOT_FOUND
        - CONFLICT
        - EMAIL_TAKEN
        - INVALID_CREDENTIALS
        - INVALID_REFRESH_TOKEN
        - INVALID_OR_EXPIRED_CODE
        - TOO_MANY_ATTEMPTS
        - RATE_LIMITED
        - SLOT_TAKEN
        - APPOINTMENT_NOT_CONFIRMED
        - APPOINTMENT_TERMINAL
        - CONSULTATION_EXISTS
        - CONSULTATION_NOT_ACTIVE
        - RECORD_EXISTS
        - FILE_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - AI_UNAVAILABLE
        - INTERNAL_ERROR
    ErrorResponseDto:
      type: object
      required:
        - statusCode
        - error
        - message
        - details
        - timestamp
        - path
        - correlationId
      properties:
        statusCode:
          type: integer
        error:
          type: string
        message:
          type: string
        details:
          type: [array, 'null']
          items:
            type: string
        timestamp:
          type: string
          format: date-time
        path:
          type: string
        correlationId:
          type: string
    HealthResponseDto:
      type: object
      required: [status, uptimeSeconds, timestamp, version]
      properties:
        status:
